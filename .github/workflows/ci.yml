name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_myevents
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build
        working-directory: apps/client

      - name: Build server
        run: npm run build
        working-directory: apps/server

      - name: Run database migrations
        run: npx drizzle-kit migrate
        working-directory: apps/server
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: ci_user
          DATABASE_PASSWORD: ci_password
          DATABASE_NAME: ci_myevents

      - name: Run server tests
        run: npm test
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_myevents
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 7d
          NODE_ENV: test
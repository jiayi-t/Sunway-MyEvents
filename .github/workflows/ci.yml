name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check client
        run: npx tsc --noEmit
        working-directory: apps/client

      - name: Type check server
        run: npx tsc --noEmit
        working-directory: apps/server

      - name: Build client
        run: npm run build
        working-directory: apps/client